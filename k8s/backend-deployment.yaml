apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitsmart-backend
  namespace: default
  labels:
    app: splitsmart-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: splitsmart-backend
  template:
    metadata:
      labels:
        app: splitsmart-backend
    spec:
      containers:
      - name: backend
        image: splitsmart-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: splitsmart-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
