version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: splitsmart-postgres
    restart: always
    environment:
      POSTGRES_DB: splitsmart
      POSTGRES_USER: splitsmart_user
      POSTGRES_PASSWORD: splitsmart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitsmart_user -d splitsmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: splitsmart-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: splitsmart-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: splitsmart_guest
      RABBITMQ_DEFAULT_PASS: splitsmart_guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Web Management Console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
